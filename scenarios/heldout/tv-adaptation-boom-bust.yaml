name: tv-adaptation-boom-bust
description: >
  A streaming series based on a fantasy book saga becomes a hit at the start of February. Fiction
  demand nearly doubles overnight and used fiction prices climb 40% over three weeks as the market
  catches up; the companion comics and graphic novels see a smaller 50% demand lift. The hype ends
  abruptly when the season finishes at the start of April: demand and prices snap back to normal,
  leaving anyone who bought heavily at boom prices holding expensive stock.
