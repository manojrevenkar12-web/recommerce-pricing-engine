name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: scripts/ci-run.sh ruff check src tests
      - run: ruff format --check src tests
      - run: scripts/ci-run.sh mypy
      - run: scripts/ci-run.sh pytest -q -p no:warnings -m "not pipeline"

  pipeline:
    name: history, models, tests, evaluation, release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RPE_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: simulate history, ingest through contracts, build warehouse, train
        run: |
          scripts/ci-run.sh rpe history
          scripts/ci-run.sh rpe ingest
          scripts/ci-run.sh rpe warehouse
          scripts/ci-run.sh rpe train
      - name: pipeline tests
        run: scripts/ci-run.sh pytest -q -p no:warnings -m pipeline
      - name: API latency
        run: scripts/ci-run.sh rpe bench-api
      - name: evaluate (backtests, ablations, scenarios, models, experiments)
        run: scripts/ci-run.sh rpe eval
      - name: steering report
        run: scripts/ci-run.sh rpe steering
      - name: release gate
        run: scripts/ci-run.sh rpe gate
      - name: evaluation report
        if: always()
        run: |
          rpe report || true
          test -f reports/EVALUATION.md && cat reports/EVALUATION.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: serving
          path: |
            models
            data/warehouse.duckdb
          retention-days: 3

  container:
    name: container and API smoke test
    needs: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: serving
          path: serving
      - run: docker build -t rpe:ci .
      - name: serve the trained models and call the API
        run: |
          chmod -R a+rX serving
          docker run -d --name api -p 8000:8000 \
            -v "$PWD/serving/models:/models:ro" -v "$PWD/serving/data:/data:ro" \
            -e RPE_API_KEYS='{"app-key": "app", "pricing-key": "pricing"}' rpe:ci
          for i in $(seq 1 60); do curl -fsS localhost:8000/ready >/dev/null 2>&1 && break; sleep 2; done
          EANS=$(docker exec api python -c "from rpe.warehouse import query; import json; print(json.dumps(query('select ean from dim_title order by idx limit 20').ean.tolist()))")
          EANS="$EANS" scripts/ci-run.sh deploy/smoke.sh http://localhost:8000
      - if: failure()
        run: docker logs api || true
